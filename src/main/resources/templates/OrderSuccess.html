<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: appHead('Order placed')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Order placed', 'user')}"></header>

<main class="ui-page grid min-h-[calc(100vh-4.5rem)] place-items-center">
    <section class="ui-card w-full max-w-2xl overflow-hidden text-center">
        <div class="bg-emerald-600 px-6 py-10 text-white">
            <span class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-white text-4xl font-black text-emerald-600 shadow-xl" aria-hidden="true">&#10003;</span>
            <p class="mt-6 text-xs font-bold uppercase tracking-[0.24em] text-emerald-100">Order confirmed</p>
            <h1 class="mt-2 text-3xl font-black sm:text-4xl">Your order is on its way</h1>
            <p class="mt-3 text-emerald-50">Thanks for ordering with Quick Bite.</p>
        </div>

        <dl class="grid gap-px bg-slate-100 text-left sm:grid-cols-2">
            <div class="bg-white p-5"><dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Order ID</dt><dd class="mt-2 text-lg font-black">#<span th:text="${order.id}">0</span></dd></div>
            <div class="bg-white p-5"><dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Customer</dt><dd class="mt-2 text-lg font-black" th:text="${order.user.name}">Customer</dd></div>
            <div class="bg-white p-5"><dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Payment</dt><dd class="mt-2 font-bold" th:text="${order.paymentMethod}">Payment</dd></div>
            <div class="bg-white p-5"><dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Total amount</dt><dd class="mt-2 text-lg font-black text-brand-600">&#8377;<span th:text="${order.totalPrice}">0</span></dd></div>
            <div class="bg-white p-5 sm:col-span-2"><dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Status</dt><dd class="mt-2"><span class="ui-badge bg-emerald-100 text-emerald-700" th:text="${order.orderStatus}">Status</span></dd></div>
        </dl>

        <div class="flex flex-col gap-3 p-6 sm:flex-row sm:justify-center">
            <a th:href="@{/UserHome}" class="ui-button-primary">Continue shopping</a>
            <a th:href="@{/orderHistory}" class="ui-button-secondary">View my orders</a>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
