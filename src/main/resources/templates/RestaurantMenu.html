<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: appHead('Restaurant menu')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Restaurant menu', 'user')}"></header>

<main class="ui-page">
    <section class="relative overflow-hidden rounded-xl bg-gradient-to-r from-[#28150c] via-[#4a210d] to-brand-700 px-6 py-8 text-white sm:px-10">
        <div class="relative z-10">
            <a th:href="@{/UserHome}" class="text-sm font-bold text-orange-200">&larr; Back to restaurants</a>
            <p class="mt-6 text-xs font-bold uppercase tracking-[0.18em] text-orange-300">Freshly prepared</p>
            <h1 class="mt-2 text-3xl font-black sm:text-4xl"
                th:text="${restaurant.restaurantName}">Restaurant Menu</h1>
            <p class="mt-2 text-sm text-orange-100">Choose your favourites and add them to the cart.</p>
        </div>
        <span class="absolute -bottom-10 right-8 hidden text-[10rem] sm:block" aria-hidden="true">&#127829;</span>
    </section>

    <nav id="menu-filters"
         class="mt-5 flex items-center gap-3 overflow-x-auto border-b border-slate-200 pb-px text-sm font-bold"
         aria-label="Filter restaurant menu">
        <button type="button" data-filter="all"
                class="menu-filter shrink-0 border-b-2 border-brand-500 px-2 py-3 text-brand-500"
                aria-pressed="true">Recommended</button>
        <button type="button" data-filter="popular"
                class="menu-filter shrink-0 border-b-2 border-transparent px-2 py-3 text-slate-500"
                aria-pressed="false">Popular</button>
        <button th:each="category : ${categories}"
                th:if="${category != null and !#strings.isEmpty(category)}"
                type="button"
                class="menu-filter shrink-0 border-b-2 border-transparent px-2 py-3 text-slate-500"
                th:attr="data-filter=${#strings.toLowerCase(category)},aria-label=${'Show ' + category + ' items'}"
                th:text="${category}"
                aria-pressed="false">Category</button>
    </nav>

    <p id="filter-result-count" class="mt-4 text-sm font-semibold text-slate-500" aria-live="polite"></p>

    <section id="restaurant-food-list" class="mt-3 grid gap-3">
        <article th:each="food, foodStatus : ${foodList}"
                 class="menu-item ui-card grid overflow-hidden sm:grid-cols-[minmax(0,1fr)_13rem]"
                 th:attr="data-category=${food.category != null ? #strings.toLowerCase(food.category.categoryName) : 'uncategorized'},data-popular=${foodStatus.index < 3}">
            <div class="order-2 flex min-w-0 flex-col p-5 sm:order-1">
                <div>
                    <span class="inline-block h-3 w-3 border border-emerald-600 p-0.5"><span class="block h-full w-full rounded-full bg-emerald-600"></span></span>
                    <h2 class="mt-2 text-lg font-black" th:text="${food.foodName}">Food name</h2>
                    <p th:if="${food.category != null}"
                       class="mt-1 text-xs font-bold uppercase tracking-wide text-brand-500"
                       th:text="${food.category.categoryName}">Category</p>
                    <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-500" th:text="${food.description}">Description</p>
                </div>
                <div class="mt-auto flex items-end justify-between gap-4 pt-5">
                    <p class="text-lg font-black">&#8377;<span th:text="${food.price}">0</span></p>
                    <a th:href="@{/addToCart/{id}(id=${food.id})}" class="ui-button-primary min-w-24 bg-white text-brand-600 ring-1 ring-inset ring-brand-300 hover:bg-brand-50">ADD</a>
                </div>
            </div>
            <div class="order-1 h-44 overflow-hidden bg-slate-100 sm:order-2 sm:h-full">
                <img th:if="${food.image != null and !#strings.isEmpty(food.image)}"
                     th:src="@{'/images/' + ${food.image}}" th:alt="${food.foodName}" class="h-full w-full object-cover">
                <div th:if="${food.image == null or #strings.isEmpty(food.image)}"
                     class="grid h-full place-items-center bg-gradient-to-br from-orange-100 to-amber-50 text-6xl" aria-hidden="true">&#127869;</div>
            </div>
        </article>
    </section>

    <div id="no-filter-results" class="ui-empty mt-5 hidden">No items are available in this section.</div>
    <div th:if="${#lists.isEmpty(foodList)}" class="ui-empty mt-5">This restaurant has not added any food items yet.</div>

    <div class="sticky bottom-4 mt-6 flex justify-center">
        <a th:href="@{/showCart}" class="ui-button-primary w-full max-w-xl justify-between px-6 shadow-xl"><span>View Cart</span><span>Continue &rarr;</span></a>
    </div>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
<script>
    (function () {
        const buttons = Array.from(document.querySelectorAll('.menu-filter'));
        const items = Array.from(document.querySelectorAll('.menu-item'));
        const emptyMessage = document.getElementById('no-filter-results');
        const resultCount = document.getElementById('filter-result-count');

        function applyFilter(filter) {
            let visibleCount = 0;

            items.forEach(function (item) {
                const visible = filter === 'all'
                    || (filter === 'popular' && item.dataset.popular === 'true')
                    || item.dataset.category === filter;
                item.classList.toggle('hidden', !visible);
                if (visible) visibleCount++;
            });

            buttons.forEach(function (button) {
                const active = button.dataset.filter === filter;
                button.setAttribute('aria-pressed', String(active));
                button.classList.toggle('border-brand-500', active);
                button.classList.toggle('text-brand-500', active);
                button.classList.toggle('border-transparent', !active);
                button.classList.toggle('text-slate-500', !active);
            });

            emptyMessage.classList.toggle('hidden', visibleCount !== 0 || items.length === 0);
            resultCount.textContent = items.length === 0
                ? ''
                : visibleCount + (visibleCount === 1 ? ' item' : ' items');
        }

        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                applyFilter(button.dataset.filter);
            });
        });

        applyFilter('all');
    }());
</script>
</body>
</html>
