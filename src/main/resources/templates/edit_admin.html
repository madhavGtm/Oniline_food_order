<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments :: appHead('Edit admin profile')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Edit admin profile', 'admin')}"></header>

<main class="ui-page">
  <section class="ui-card mx-auto max-w-2xl p-6 sm:p-10">
    <p class="ui-kicker">Account settings</p><h1 class="ui-title">Edit admin profile</h1><p class="ui-subtitle">Update the details used for this administrator account.</p>
    <form th:action="@{/update_admin}" method="post" class="mt-8 space-y-5">
      <div><label for="name" class="ui-label">Name</label><input id="name" type="text" name="name" th:value="${data.name}" class="ui-input" autocomplete="name" required></div>
      <div><label for="email" class="ui-label">Email</label><input id="email" type="email" name="email" th:value="${data.email}" class="ui-input ui-input-readonly" readonly></div>
      <div><label for="password" class="ui-label">Password</label><input id="password" type="password" name="password" th:value="${data.password}" class="ui-input" autocomplete="current-password" required></div>
      <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:justify-end"><a th:href="@{/adminHome}" class="ui-button-secondary">Cancel</a><button type="submit" class="ui-button-primary">Save changes</button></div>
    </form>
  </section>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
