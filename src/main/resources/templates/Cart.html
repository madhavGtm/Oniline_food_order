<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments :: appHead('Your cart')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Your cart', 'user')}"></header>

<main class="ui-page">
  <div class="flex items-center justify-between gap-4 border-b border-slate-200 pb-5"><div><a th:href="@{/UserHome}" class="text-sm font-bold text-slate-500">&larr; Continue shopping</a><h1 class="ui-title">Your Cart</h1></div><span class="rounded-full bg-brand-50 px-3 py-1 text-xs font-bold text-brand-600">Review items</span></div>

  <div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_22rem]">
    <section class="ui-card divide-y divide-slate-100 overflow-hidden">
      <article th:each="cart : ${cartList}" class="grid gap-4 p-4 sm:grid-cols-[6rem_minmax(0,1fr)_auto] sm:items-center">
        <img th:src="@{'/images/' + ${cart.food.image}}" alt="Food item" class="h-24 w-full rounded-lg object-cover sm:w-24">
        <div class="min-w-0"><h2 class="font-black text-slate-950" th:text="${cart.food.foodName}">Food</h2><p class="mt-1 truncate text-xs text-slate-500" th:text="${cart.food.restaurant.restaurantName}">Restaurant</p><p class="mt-2 text-sm font-black">&#8377;<span th:text="${cart.price}">0</span></p></div>
        <div class="flex items-center justify-between gap-5 sm:block sm:text-right">
          <div class="inline-flex items-center rounded-lg border border-slate-200 bg-white p-1"><a th:href="@{'/decrease/' + ${cart.id}}" class="grid h-8 w-8 place-items-center rounded-md font-black hover:bg-slate-100" aria-label="Decrease quantity">&minus;</a><span class="min-w-8 text-center text-sm font-black" th:text="${cart.quantity}">1</span><a th:href="@{'/increase/' + ${cart.id}}" class="grid h-8 w-8 place-items-center rounded-md font-black hover:bg-brand-50 hover:text-brand-600" aria-label="Increase quantity">+</a></div>
          <p class="mt-3 hidden text-sm font-black sm:block">&#8377;<span th:text="${cart.price * cart.quantity}">0</span></p>
          <a th:href="@{'/removeCart/' + ${cart.id}}" class="mt-2 inline-block text-xs font-bold text-rose-600" onclick="return confirm('Remove this item?')">Remove</a>
        </div>
      </article>
      <div th:if="${#lists.isEmpty(cartList)}" class="ui-empty m-4">Your cart is empty. Add a dish to get started.</div>
    </section>

    <aside class="ui-card h-fit p-5 lg:sticky lg:top-22">
      <h2 class="text-lg font-black">Bill details</h2>
      <div class="mt-5 grid gap-3 border-b border-dashed border-slate-200 pb-5 text-sm"><div class="flex justify-between text-slate-500"><span>Item total</span><span>&#8377;<span th:text="${total}">0</span></span></div><div class="flex justify-between text-slate-500"><span>Delivery fee</span><span>Calculated at checkout</span></div></div>
      <div class="flex items-end justify-between py-5"><span class="font-black">To Pay</span><span class="text-2xl font-black">&#8377;<span th:text="${total}">0</span></span></div>
      <a th:href="@{/checkout}" class="ui-button-primary w-full">Proceed to Checkout</a>
    </aside>
  </div>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
