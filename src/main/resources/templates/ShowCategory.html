<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: appHead('Categories')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Categories', 'restaurant')}"></header>

<main class="ui-page">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div><p class="ui-kicker">Menu organization</p><h1 class="ui-title">Categories</h1><p class="ui-subtitle">Keep the menu tidy and easy for customers to browse.</p></div>
        <a th:href="@{/categoryRegister}" class="ui-button-primary">Add category</a>
    </div>
    <section class="ui-card mt-8 p-4 sm:p-6">
        <div class="ui-table-wrap">
            <table class="ui-table">
                <thead><tr><th>ID</th><th>Image</th><th>Category</th><th class="text-right">Actions</th></tr></thead>
                <tbody>
                <tr th:each="c : ${list}">
                    <td class="font-black text-slate-900">#<span th:text="${c.id}">0</span></td>
                    <td><img th:src="@{'/images/' + ${c.image}}" alt="Category" class="h-16 w-20 rounded-xl object-cover"></td>
                    <td class="font-black text-slate-900" th:text="${c.categoryName}">Category</td>
                    <td><div class="flex justify-end gap-2"><a th:href="@{/editCategory/{id}(id=${c.id})}" class="ui-button-secondary min-h-9 px-4 py-2">Edit</a><a th:href="@{/deleteCategory/{id}(id=${c.id})}" class="inline-flex min-h-9 items-center rounded-xl bg-rose-50 px-4 py-2 text-xs font-bold text-rose-700 hover:bg-rose-100" onclick="return confirm('Are you sure you want to delete this category?')">Delete</a></div></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(list)}" class="ui-empty mt-4">No categories yet. Create one to organize your menu.</div>
    </section>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
