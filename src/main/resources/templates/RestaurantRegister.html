<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: appHead('Register restaurant')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Register restaurant', 'admin')}"></header>

<main class="ui-page">
    <section class="ui-card mx-auto max-w-4xl overflow-hidden">
        <div class="bg-slate-950 p-7 text-white sm:p-10"><p class="ui-kicker text-brand-300">New partner</p><h1 class="mt-3 text-3xl font-black sm:text-4xl">Register a restaurant</h1><p class="mt-3 max-w-2xl text-slate-400">Add business details, operating hours, and a profile image.</p></div>
        <form th:action="@{/RestaurantRegister}" th:object="${restaurant}" method="post" enctype="multipart/form-data" class="grid gap-5 p-6 sm:grid-cols-2 sm:p-10">
            <div class="sm:col-span-2"><label for="restaurantName" class="ui-label">Restaurant name</label><input id="restaurantName" type="text" th:field="*{restaurantName}" class="ui-input" placeholder="Restaurant name" required></div>
            <div class="sm:col-span-2"><label for="address" class="ui-label">Address</label><textarea id="address" th:field="*{address}" class="ui-input min-h-28 resize-y" placeholder="Full restaurant address" required></textarea></div>
            <div><label for="contact" class="ui-label">Contact number</label><input id="contact" type="tel" th:field="*{contact}" class="ui-input" placeholder="Phone number" autocomplete="tel" required></div>
            <div><label for="email" class="ui-label">Email</label><input id="email" type="email" th:field="*{email}" class="ui-input" placeholder="restaurant@example.com" autocomplete="email" required></div>
            <div class="sm:col-span-2"><label for="password" class="ui-label">Password</label><input id="password" type="password" th:field="*{password}" class="ui-input" placeholder="Create a secure password" autocomplete="new-password" required></div>
            <div class="sm:col-span-2"><label for="imageFile" class="ui-label">Restaurant image</label><input id="imageFile" type="file" name="imageFile" accept="image/*" class="ui-input file:mr-4 file:rounded-lg file:border-0 file:bg-brand-50 file:px-4 file:py-2 file:text-sm file:font-bold file:text-brand-700" required></div>
            <div><label for="openingTime" class="ui-label">Opening time</label><input id="openingTime" type="time" th:field="*{openingTime}" class="ui-input" required></div>
            <div><label for="closingTime" class="ui-label">Closing time</label><input id="closingTime" type="time" th:field="*{closingTime}" class="ui-input" required></div>
            <div class="mt-2 flex flex-col-reverse gap-3 sm:col-span-2 sm:flex-row sm:justify-end"><a th:href="@{/adminHome}" class="ui-button-secondary">Cancel</a><button type="submit" class="ui-button-primary">Register restaurant</button></div>
        </form>
    </section>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
