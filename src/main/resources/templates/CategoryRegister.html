<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: appHead('Add category')}"></th:block>
</head>
<body>
<header th:replace="~{fragments :: reactHeader('Add category', 'restaurant')}"></header>

<main class="ui-page">
    <section class="ui-card mx-auto max-w-xl p-6 sm:p-10">
        <span class="grid h-14 w-14 place-items-center rounded-2xl bg-violet-100 text-2xl font-black text-violet-700" aria-hidden="true">+</span>
        <p class="ui-kicker mt-6">Menu organization</p><h1 class="ui-title">Create a category</h1><p class="ui-subtitle">Add a name and image customers can quickly recognize.</p>
        <form th:action="@{/saveCategory}" method="post" enctype="multipart/form-data" class="mt-8 space-y-5">
            <div><label for="categoryName" class="ui-label">Category name</label><input id="categoryName" type="text" name="categoryName" class="ui-input" placeholder="For example: Main course" required></div>
            <div><label for="imageFile" class="ui-label">Category image</label><input id="imageFile" type="file" name="imageFile" accept="image/*" class="ui-input file:mr-4 file:rounded-lg file:border-0 file:bg-brand-50 file:px-4 file:py-2 file:text-sm file:font-bold file:text-brand-700" required></div>
            <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:justify-end"><a th:href="@{/showCategory}" class="ui-button-secondary">Cancel</a><button type="submit" class="ui-button-primary">Save category</button></div>
        </form>
    </section>
</main>

<th:block th:replace="~{fragments :: reactScripts}"></th:block>
</body>
</html>
